name: Release main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify the exact merged commit
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_documents.py --check
          python3 -m unittest discover -s .github/tests -p 'test_*.py'
      - name: Resolve immutable release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          echo "tag=$(python3 .github/scripts/versioning.py)" >> "$GITHUB_OUTPUT"
      - name: Build validated platform release assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/build_bundles.py --tag "$RELEASE_TAG" --check
          python3 .github/scripts/build_bundles.py --tag "$RELEASE_TAG"
          cd dist && sha256sum --check SHA256SUMS
      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            existing="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG belongs to $existing, not $GITHUB_SHA"
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
          # Publishing a tag must never silently replace an existing immutable asset.
          published="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for file in dist/*.zip dist/SHA256SUMS; do
            name="${file##*/}"
            if grep -Fxq "$name" <<< "$published"; then
              existing_dir="$(mktemp -d)"
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing_dir"
              cmp "$file" "$existing_dir/$name" || {
                echo "::error::Immutable release asset differs: $name"
                exit 1
              }
              rm -rf "$existing_dir"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          gh release view "$RELEASE_TAG" --json tagName,url
      - name: Independently verify published tag and downloaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          published_dir="$(mktemp -d)"
          trap 'rm -rf "$published_dir"' EXIT
          gh release download "$RELEASE_TAG" --dir "$published_dir"
          python3 .github/scripts/verify_published_release.py \
            --tag "$RELEASE_TAG" --local-dir dist --published-dir "$published_dir"
