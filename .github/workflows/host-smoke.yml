name: Host package smoke tests
on:
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, pi, codex, dsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile reproducible host bundles
        run: |
          set -euo pipefail
          python3 .github/scripts/build_bundles.py --tag v0.0.0 --check
          python3 .github/scripts/build_bundles.py --tag v0.0.0
          mkdir -p "$RUNNER_TEMP/agent-os-host"
          unzip -q "dist/agent-os-${{ matrix.host }}-v0.0.0.zip" -d "$RUNNER_TEMP/agent-os-host"
      - name: Validate Claude plugin using native CLI
        if: matrix.host == 'claude'
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code
          claude plugin validate "$RUNNER_TEMP/agent-os-host" --strict
      - name: Install and inspect Pi package using native CLI
        if: matrix.host == 'pi'
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts @mariozechner/pi-coding-agent
          mkdir -p "$RUNNER_TEMP/agent-os-sandbox"
          cd "$RUNNER_TEMP/agent-os-sandbox"
          pi install -l "$RUNNER_TEMP/agent-os-host"
          pi list
          test -f .pi/settings.json
          grep -F 'agent-os-host' .pi/settings.json
      - name: Register and install Codex plugin from local marketplace
        if: matrix.host == 'codex'
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts @openai/codex
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME" "$RUNNER_TEMP/codex-marketplace/plugins" "$RUNNER_TEMP/codex-marketplace/.agents/plugins"
          mv "$RUNNER_TEMP/agent-os-host" "$RUNNER_TEMP/codex-marketplace/plugins/agent-os"
          cat > "$RUNNER_TEMP/codex-marketplace/.agents/plugins/marketplace.json" <<'MARKETPLACE'
          {
            "name": "agent-os-smoke",
            "plugins": [
              {
                "name": "agent-os",
                "source": { "source": "local", "path": "./plugins/agent-os" },
                "policy": { "installation": "AVAILABLE", "authentication": "ON_INSTALL" },
                "category": "Productivity"
              }
            ]
          }
          MARKETPLACE
          codex plugin marketplace add "$RUNNER_TEMP/codex-marketplace"
          codex plugin add agent-os@agent-os-smoke
          codex plugin list
      - name: Discover and load native DSH filesystem skills
        if: matrix.host == 'dsh'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-provider-test"
          cp .github/tests/dsh_provider_smoke.mjs "$RUNNER_TEMP/dsh-provider-test/smoke.mjs"
          cd "$RUNNER_TEMP/dsh-provider-test"
          npm init --yes >/dev/null
          npm install --no-save @deepseek-ai/cordis@next @deepseek-ai/dsh-skill@next @deepseek-ai/dsh-skill-filesystem@next
          expected="$(python3 -c 'import json;print(json.dumps(json.load(open("'"$GITHUB_WORKSPACE"'/.agents/bundle/bundle.json"))["skills"]))')"
          node smoke.mjs "$RUNNER_TEMP/agent-os-host/.agents/skills" "$expected"
