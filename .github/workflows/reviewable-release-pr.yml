name: Prepare reviewable main promotion PR

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: reviewable-main-promotion
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create bot-authored promotion PR and request required checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch_sha="$(gh api "repos/$REPO/branches/development" --jq '.commit.sha')"
          ahead="$(gh api "repos/$REPO/compare/main...development" --jq '.ahead_by')"
          if [ "$ahead" -eq 0 ]; then
            echo "No development commits to promote"
            exit 0
          fi

          pr="$(gh pr list --repo "$REPO" --base main --head development --state open --json number,author --jq '.[0] // empty')"
          if [ -n "$pr" ]; then
            author="$(jq -r '.author.login' <<< "$pr")"
            if [ "$author" != "app/github-actions" ] && [ "$author" != "github-actions[bot]" ]; then
              echo "::error::An existing user-authored development -> main PR cannot be approved by its own author. Review or close that PR before bot creation."
              exit 1
            fi
            number="$(jq -r '.number' <<< "$pr")"
            echo "Bot-authored PR #$number already exists; refreshing manual checks."
          else
            number="$(gh pr create --repo "$REPO" --base main --head development \
              --title "Review and release development to main" \
              --body "Bot-authored main release promotion. The sole source is the current development branch. Review actual diff and checks before approving; release occurs only after merge to main. AGENTS.md and Agent Skills are bundled from canonical sources; do not claim benchmark gains without model trials." \
              --json number --jq '.number')"
            echo "Opened reviewable bot-authored PR #$number"
          fi

          # Pull requests created by GITHUB_TOKEN do not produce pull_request runs.
          # Dispatch workflows on the same development SHA so required checks are visible.
          gh workflow run main-source.yml --repo "$REPO" --ref development -f pr_number="$number"
          gh workflow run docs.yml --repo "$REPO" --ref development
          gh workflow run host-smoke.yml --repo "$REPO" --ref development
          gh workflow run darkfactory.yml --repo "$REPO" --ref development
          echo "Dispatched required checks for development commit $branch_sha and reviewable PR #$number"
